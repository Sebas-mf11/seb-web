<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Categorías · Commerce CMS</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Unbounded:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="is-booting">
    <div class="boot" role="status" aria-label="Cargando">
      <span class="spinner"></span>
    </div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
          <div class="toolbar">
            <div class="search">
              <span data-icon="search" data-icon-size="17"></span>
              <label class="sr-only" for="search">Buscar categorías</label>
              <input class="input" type="search" id="search" autocomplete="off" />
            </div>

            <span class="toolbar__count" id="result-count"></span>

            <button class="btn btn--primary" type="button" id="create">
              <span data-icon="plus" data-icon-size="17"></span>
              <span id="create-label">Nueva categoría</span>
            </button>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr id="crud-head"></tr>
                </thead>
                <tbody id="crud-body"></tbody>
              </table>
            </div>

            <div class="pagination" id="pagination" hidden></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="js/categories.js"></script>
  </body>
</html>
